
name: Build OpenJDK 17 and 21 for Android

on:
  push:
    branches: [buildjre17-21]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_android:
    strategy:
      matrix:
        arch: ["aarch32", "aarch64", "x86", "x86_64"]
        version: [17, 21]
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version }}
          distribution: temurin

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev

      - name: Build
        run: |
          export TARGET_VERSION=${{ matrix.version }}
          bash "1_ci_build_arch_${{ matrix.arch }}.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-${{ matrix.arch }}"
          path: jre${{ matrix.version }}*.tar.xz
          if-no-files-found: error

  pojav:
    needs: build_android
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        version: [17, 21]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt -y install zip

      - uses: actions/download-artifact@v4
        with:
          pattern: jre${{ matrix.version }}-*
          path: pojav
          merge-multiple: true

      - name: Repack JRE
        run: |
          export TARGET_VERSION=${{ matrix.version }}
          bash "9_repackjre.sh" "$GITHUB_WORKSPACE/pojav" "$GITHUB_WORKSPACE/pojav/jre${{ matrix.version }}-pojav"
          zip -j -r "$GITHUB_WORKSPACE/jre${{ matrix.version }}-pojav.zip" "$GITHUB_WORKSPACE/pojav/jre${{ matrix.version }}-pojav/"

      - uses: actions/upload-artifact@v4
        with:
          name: jre${{ matrix.version }}-pojav
          path: jre${{ matrix.version }}-pojav.zip
          if-no-files-found: error
          retention-days: 30
          
