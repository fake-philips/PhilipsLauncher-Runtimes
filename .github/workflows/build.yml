
name: Build OpenJDK 8 for Android

on:
  push:
    branches: [buildjre8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_android:
    strategy:
      matrix:
        arch: ["aarch64", "aarch32", "x86_64", "x86"]
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: zulu

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev gcc-multilib g++-multilib libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxrender-dev libxtst-dev libxt-dev

      - name: Build
        run: bash "ci_build_arch_${{ matrix.arch }}.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: "jre8-${{ matrix.arch }}"
          path: jre8*.tar.xz
          if-no-files-found: error

  pojav:
    needs: build_android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt -y install zip

      - uses: actions/download-artifact@v4
        with:
          pattern: jre8-*
          path: pojav
          merge-multiple: true

      - name: Repack JRE
        run: |
          bash repackjre.sh "$GITHUB_WORKSPACE/pojav" "$GITHUB_WORKSPACE/pojav/jre8-pojav"
          zip -j -r "$GITHUB_WORKSPACE/jre8-pojav.zip" "$GITHUB_WORKSPACE/pojav/jre8-pojav/"

      - uses: actions/upload-artifact@v4
        with:
          name: jre8-pojav
          path: jre8-pojav.zip
          if-no-files-found: error
          retention-days: 30
          
